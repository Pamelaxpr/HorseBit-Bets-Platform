---
- name: "Paso 2: Grupo de Seguridad (NSG)"
  hosts: localhost
  connection: local
  collections:
    - azure.azcollection

  vars:
    resource_group: "Horsebit_Productivo_rg"
    location: "spaincentral"
    nsg_name: "NSG_Web"

  tasks:
      - name: 1. Crear Grupo de Seguridad de Red (NSG) con reglas web (HTTP) y SSH
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}"
        name: "{{ nsg_name }}"
        location: "{{ location }}"
        rules:
          - name: Permitir_SSH
            protocol: Tcp
            destination_port_range: 22
            access: Allow
            priority: 1000
            direction: Inbound
          - name: Permitir_HTTP
            protocol: Tcp
            destination_port_range: 80
            access: Allow
            priority: 1010
            direction: Inbound
          - name: Allow_HTTPS
            protocol: Tcp
            destination_port_range: 443
            access: Allow
            priority: 1020
            direction: Inbound

    - name: 2. Asociar el NSG a la Subred Backend
      azure.azcollection.azure_rm_subnet:
        resource_group: "{{ resource_group }}"
        virtual_network: "{{ vnet_name }}"
        name: "{{ subnet_name }}"
        address_prefix: "{{ backend_subnet_cidr }}"
        security_group: "{{ nsg_name }}"

