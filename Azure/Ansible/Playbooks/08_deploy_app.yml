---
- name: "Paso 8: Despliegue de HorseBit-App (Local -> Servidor Azure)"
  hosts: productivo
  become: true

  vars:
    app_dir: "/var/www/horsebit"

  tasks:
    - name: 1. Instalar PM2 globalmente con npm
      npm:
        name: pm2
        global: yes
        state: present

    - name: 2. Crear carpetas de destino en el servidor
      file:
        path: "{{ item }}"
        state: directory
        owner: azureuser
        group: azureuser
        mode: '0755'
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/frontend"
        - "{{ app_dir }}/backend"

    - name: 3. Copiar FRONTEND local directamente al servidor (HTML + Assets)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../HorseBit-App/frontend/"
        dest: "{{ app_dir }}/frontend/"
        owner: azureuser
        group: azureuser
        mode: '0644'

    - name: 4. Copiar BACKEND local al servidor (server.js, package.json, etc.)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../HorseBit-App/backend/"
        dest: "{{ app_dir }}/backend/"
        owner: azureuser
        group: azureuser
        mode: '0644'

    - name: 5. Instalar dependencias de Node.js en el backend
      shell: npm install --omit=dev
      args:
        chdir: "{{ app_dir }}/backend"
      become_user: azureuser

    - name: 6. Iniciar el servidor Node.js con PM2
      shell: pm2 start server.js --name "horsebit-app" --update-env || pm2 restart horsebit-app
      args:
        chdir: "{{ app_dir }}/backend"
      become_user: azureuser

    - name: 7. Asegurar que PM2 arranque al reiniciar el servidor
      shell: env PATH=$PATH:/usr/bin pm2 startup systemd -u azureuser --hp /home/azureuser || true

    - name: 8. Configurar Nginx como Proxy Inverso hacia Node.js (puerto 3000)
      replace:
        path: /etc/nginx/sites-available/default
        regexp: 'try_files \$uri \$uri/ =404;'
        replace: 'proxy_pass http://localhost:3000;'

    - name: 9. Reiniciar Nginx para aplicar la configuración
      service:
        name: nginx
        state: restarted
