---
# =====================================================================
# Playbook 11 — Configurar HAProxy como balanceador de carga HTTP
# Hosts: localhost (nodo de control)
# =====================================================================
- name: "Paso 11: Configurar HAProxy Balanceador HTTP"
  hosts: localhost
  connection: local
  become: yes

  tasks:
    - name: 1. Instalar HAProxy
      ansible.builtin.package:
        name:  haproxy
        state: present

    - name: 2. Configurar reparto de tráfico round-robin
      ansible.builtin.blockinfile:
        path:   /etc/haproxy/haproxy.cfg
        marker: "# {mark} HORSEBIT BLOCK"
        block: |
          frontend http_front
              bind *:80
              default_backend servidores_web

          backend servidores_web
              balance roundrobin
              server hipodromo-a 192.168.1.159:80 check
              server hipodromo-b 192.168.1.161:80 check

    - name: 3. Reiniciar HAProxy para aplicar cambios
      ansible.builtin.service:
        name:    haproxy
        state:   restarted
        enabled: yes
